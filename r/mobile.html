<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라피네 클래스 모바일 점검</title>
<style>
  body{margin:0;background:#cbd5e1;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;padding:10px;display:flex;gap:10px;align-items:flex-start}
  .wrap{background:#fff;border-radius:18px;padding:8px;box-shadow:0 6px 18px rgba(15,23,42,.18)}
  .cap{font-size:11px;font-weight:700;color:#334155;margin:0 0 6px 4px}
  iframe{width:390px;height:830px;border:0;border-radius:12px;background:#fff;display:block}
</style>
</head>
<body>
  <div class="wrap"><p class="cap">390 × 830 (iPhone 기준)</p><iframe id="f" src="https://raffinegold.github.io/rafine-class/"></iframe></div>
  <script>
    var params = new URLSearchParams(location.search);
    var p = params.get('p');
    var base = 'https://raffinegold.github.io/rafine-class/';
    var f = document.getElementById('f');
    if (p) f.src = base + p.replace(/^\//, '');
    var q = params.get('q');
    if (q) f.src = base + '?fresh=' + encodeURIComponent(q);
  </script>
</body>
</html>
