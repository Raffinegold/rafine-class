<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라피네 클래스 모바일 점검</title>
<style>
  body{margin:0;background:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;padding:10px;display:flex;gap:10px;align-items:flex-start}
  .wrap{background:#fff;border-radius:18px;padding:8px;box-shadow:0 6px 18px rgba(15,23,42,.12)}
  .cap{font-size:11px;font-weight:700;color:#475569;margin:0 0 6px 4px}
  iframe{width:390px;height:820px;border:0;border-radius:12px;background:#fff;display:block}
</style>
</head>
<body>
  <div class="wrap"><p class="cap">390 × 820 (iPhone 기준)</p><iframe id="f" src="./"></iframe></div>
  <script>
    var p = new URLSearchParams(location.search).get('p');
    if (p) document.getElementById('f').src = './' + p.replace(/^\//,'');
    var q = new URLSearchParams(location.search).get('q');
    if (q) document.getElementById('f').src = './?fresh=' + encodeURIComponent(q);
  </script>
</body>
</html>
